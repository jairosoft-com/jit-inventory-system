server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the React SPA — fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container over Docker's internal network.
    # "backend" must match the service name in docker-compose.yml.
    #
    # IMPORTANT: no trailing slash on proxy_pass here — the backend's own
    # routes are mounted at /api/... (see apps/backend/src/index.ts), so the
    # full incoming path (e.g. /api/auth/login) must be forwarded unchanged.
    # Adding a trailing slash would strip the /api/ prefix and break routing.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
